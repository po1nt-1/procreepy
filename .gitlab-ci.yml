# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/ci/variables/secret_detection/
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- build
- verify
- secret-detection
- release

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GO_IMAGE: golang:1.27.1
  SECRET_DETECTION_ENABLED: 'true'
  # Reproducibility: pin the toolchain and forbid any network/toolchain drift.
  # The module has zero dependencies, so GOPROXY=off must always hold.
  GOTOOLCHAIN: "local"
  GOPROXY: "off"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "0"
  GIT_DEPTH: "0"

sast:
  stage: test

secret_detection:
  stage: secret-detection

test:
  stage: test
  image: $GO_IMAGE
  script:
    # Definition of done in one step: gofmt, compile, vet, full suite.
    # The suite's e2e run self-aggregates cover.e2e.out; e2e must never
    # run under -coverprofile (the two writers would collide).
    - make check
    # Profile the non-e2e packages, merge with cover.e2e.out, and render
    # the Cobertura report the coverage: regex below reads the total from.
    - make coverage
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Release builds for the supported platforms. The code is pure Go with
# per-OS shims (io_linux.go / io_darwin.go / io_windows.go), so all three
# GOOS targets cross-compile with CGO_ENABLED=0.
build:
  stage: build
  image: $GO_IMAGE
  parallel:
    matrix:
    - GOOS: linux
      GOARCH: [amd64, arm64, arm]
    - GOOS: windows
      GOARCH: [amd64, arm64]
    - GOOS: darwin
      GOARCH: [amd64, arm64]
  script:
    - make release GOOS=$GOOS GOARCH=$GOARCH VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
  artifacts:
    paths:
    - dist/
    expire_in: 30 days

# Aggregate every architecture into one dist/ tree with a checksum manifest.
dist:
  stage: verify
  image: $GO_IMAGE
  needs:
  - job: build
    artifacts: true
  script:
    - cd dist
    - sha256sum ./*.tar.gz > SHA256SUMS
    - cat SHA256SUMS
  artifacts:
    paths:
    - dist/
    expire_in: 30 days

# Reproducibility proof: the same sources built on two different base
# images (glibc vs musl) must yield the identical linux/amd64 binary.
.repro-build:
  stage: verify
  variables:
    GOOS: linux
    GOARCH: amd64

repro:glibc:
  extends: .repro-build
  image: $GO_IMAGE
  variables:
    FLAVOR: glibc
  script:
    - make repro FLAVOR=glibc
  artifacts:
    paths:
    - repro-glibc.sha256

repro:musl:
  extends: .repro-build
  image: golang:1.27.1-alpine
  variables:
    FLAVOR: musl
  script:
    # The alpine image ships no make. Installing it does not affect the
    # proof: pure Go, no cgo, -trimpath.
    - apk add --no-cache make
    - make repro FLAVOR=musl
  artifacts:
    paths:
    - repro-musl.sha256

repro:compare:
  stage: verify
  image: $GO_IMAGE
  needs:
  - job: repro:glibc
    artifacts: true
  - job: repro:musl
    artifacts: true
  script:
    - cmp repro-glibc.sha256 repro-musl.sha256
    - 'echo "reproducible: $(cat repro-glibc.sha256) (glibc == musl)"'

# Decides from Conventional Commits whether a new version is due. No release
# commit is created (assets: []), so nothing extra lands on main; the
# semantic-release core itself creates the vX.Y.Z tag (tagFormat default) and
# pushes it to origin. That one tag is the single input both hosts'
# goreleaser jobs publish from.
release:
  stage: release
  image: node:22-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - test
  variables:
    GIT_AUTHOR_NAME: "procreepy release"
    GIT_AUTHOR_EMAIL: "13149478-po1nt-1@users.noreply.gitlab.com"
    GIT_COMMITTER_NAME: "procreepy release"
    GIT_COMMITTER_EMAIL: "13149478-po1nt-1@users.noreply.gitlab.com"
  script:
    - npm install --no-save --no-audit --no-fund semantic-release@25.0.9 @semantic-release/git@11.0.1 conventional-changelog-conventionalcommits@8.0.0
    # Push the tag with the protected PAT instead of the job token:
    # CI_JOB_TOKEN cannot create new refs by default, and a job-token push
    # would not trigger the tag pipeline goreleaser depends on anyway.
    # GITLAB_TOKEN is a Protected variable, so this job needs main to be a
    # protected branch.
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@$(git remote get-url origin | sed -E 's#^https://[^@]*@##; s#^https://##')"
    - npx --no-install semantic-release

# Publishes the tag as a GitLab Release. GoReleaser resolves the target
# platform from the origin remote (here: GitLab) and authenticates with the
# GITLAB_TOKEN project variable, so the same tag yields exactly one release
# per host — a re-run of this pipeline errors on the existing release
# instead of duplicating it.
goreleaser:
  stage: release
  image: $GO_IMAGE
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/'
  # Wait for test as a gate only: inheriting any job's artifacts would
  # drop untracked files into the checkout and fail goreleaser's
  # dirty-state check.
  needs:
    - job: test
      artifacts: false
  script:
    - curl -LsSfL https://github.com/goreleaser/goreleaser/releases/download/v2.18.2/goreleaser_Linux_x86_64.tar.gz -o /tmp/goreleaser.tar.gz
    - tar -C /usr/local/bin -xzf /tmp/goreleaser.tar.gz goreleaser
    - goreleaser release --clean
  artifacts:
    paths:
    - dist/
    expire_in: 30 days
