# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/ci/variables/secret_detection/
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- images
- test
- build
- verify
- secret-detection
- release

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GO_IMAGE: golang:1.27.1
  SECRET_DETECTION_ENABLED: 'true'
  # Reproducibility: pin the toolchain and forbid any network/toolchain drift.
  # The module has zero dependencies, so GOPROXY=off must always hold.
  GOTOOLCHAIN: "local"
  GOPROXY: "off"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "0"
  GIT_DEPTH: "0"

sast:
  stage: test

secret_detection:
  stage: secret-detection

# ---------------------------------------------------------------------------
# Container images used by later stages, built and pushed to the project
# registry with kaniko (no Docker daemon). Reusable base: a concrete image
# job sets IMAGE_CONTEXT (dir holding a Containerfile) and IMAGE_NAME
# (full registry path:tag), and a `rules: changes:` block so the image is
# rebuilt only when its own directory changes — every other pipeline just
# pulls the tag that is already in the registry.
# ---------------------------------------------------------------------------
.kaniko-build:
  stage: images
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Authenticate kaniko to the project registry with the job token.
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$IMAGE_CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$IMAGE_CONTEXT/Containerfile"
      --destination "$IMAGE_NAME"

# Windows test image: wine64 + a windows/amd64 Go toolchain (see
# ci/windows-wine/). Consumed by the test:windows job below.
build:winci-image:
  extends: .kaniko-build
  variables:
    IMAGE_CONTEXT: ci/windows-wine
  rules:
    # An MR that touches the image publishes it under a branch-scoped tag, so
    # an unreviewed change can never clobber the tag other pipelines consume.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
      - ci/windows-wine/**/*
      variables:
        IMAGE_NAME: $CI_REGISTRY_IMAGE/winci:1.27.1-$CI_COMMIT_REF_SLUG
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
      - ci/windows-wine/**/*
      variables:
        IMAGE_NAME: $CI_REGISTRY_IMAGE/winci:1.27.1

test:
  stage: test
  image: $GO_IMAGE
  script:
    # Definition of done in one step: gofmt, compile, vet, full suite.
    # The suite's e2e run self-aggregates cover.e2e.out; e2e must never
    # run under -coverprofile (the two writers would collide).
    - make check
    # Profile the non-e2e packages, merge with cover.e2e.out, and render
    # the Cobertura report the coverage: regex below reads the total from.
    - make coverage
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Windows is the primary user scenario (PLAN §16), so the suite also runs
# against the real windows/amd64 binary — its e2e part builds and executes
# procreepy.exe (path, rename and console behavior included). The project has
# no `windows`-tagged runner, so the former native job sat pending until it
# failed with stuck_pending_no_matching_runners. Instead we run the identical
# `go build/vet/test ./...` under Wine on an ordinary Linux runner: the image
# (ci/windows-wine/) bundles wine64 + a windows/amd64 Go 1.27.1 toolchain, and
# run-tests.sh drives each `go` as `wine go.exe` — see ci/windows-wine/README.md.
#
# The image itself is built by build:winci-image in the earlier `images`
# stage, and only when ci/windows-wine/ changes; every other pipeline just
# pulls the tag already in the registry. No manual bootstrap is needed: the
# first pipeline that adds this directory builds the image before this job
# runs.
test:windows:
  stage: test
  image: $CI_REGISTRY_IMAGE/winci:$WINCI_TAG
  variables:
    WINEDEBUG: "-all"
    WINCI_TAG: "1.27.1"
  # Go-under-Wine compiles slowly, so this job is not worth a slot in every
  # pipeline: it runs on release tags (where Windows is a real gate), and
  # otherwise only when something that can actually change Windows behavior
  # moved. A docs-only or CI-only commit leaves it as an optional manual job.
  rules:
    # Mirrors build:winci-image's MR condition: when this MR rebuilt the image,
    # consume that branch-scoped tag so the MR tests its own image rather than
    # the shared one. Every other pipeline pulls the stable tag.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
      - ci/windows-wine/**/*
      variables:
        WINCI_TAG: "1.27.1-$CI_COMMIT_REF_SLUG"
    # Release tags always get the Windows gate, whatever the diff looks like.
    - if: '$CI_COMMIT_TAG'
    # Branch and MR pipelines: only on Windows-relevant changes. There is no
    # go.sum — the module has zero dependencies.
    - changes:
      - "**/*.go"
      - go.mod
      - Makefile
      - ci/windows-wine/**/*
    # Anything else: still reachable, but only when someone asks for it.
    # allow_failure (below) keeps this optional, so it never blocks a pipeline.
    - when: manual
  script:
  - run-tests.sh
  timeout: 30m
  # Wine is not a byte-perfect Windows; keep it non-blocking until proven
  # stable, then drop this line so Windows regressions fail the pipeline.
  allow_failure: true

# Release builds for the supported platforms. The code is pure Go with
# per-OS shims (io_linux.go / io_darwin.go / io_windows.go), so all three
# GOOS targets cross-compile with CGO_ENABLED=0.
build:
  stage: build
  image: $GO_IMAGE
  parallel:
    matrix:
    - GOOS: linux
      GOARCH: [amd64, arm64, arm]
    - GOOS: windows
      GOARCH: [amd64, arm64]
    - GOOS: darwin
      GOARCH: [amd64, arm64]
  script:
    - make release GOOS=$GOOS GOARCH=$GOARCH VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
  artifacts:
    paths:
    - dist/
    expire_in: 30 days

# Aggregate every architecture into one dist/ tree with a checksum manifest.
dist:
  stage: verify
  image: $GO_IMAGE
  needs:
  - job: build
    artifacts: true
  script:
    - cd dist
    - sha256sum ./*.tar.gz > SHA256SUMS
    - cat SHA256SUMS
  artifacts:
    paths:
    - dist/
    expire_in: 30 days

# Reproducibility proof: the same sources built on two different base
# images (glibc vs musl) must yield the identical linux/amd64 binary.
.repro-build:
  stage: verify
  variables:
    GOOS: linux
    GOARCH: amd64
    # Pin the stamped version for both legs instead of letting the Makefile
    # derive dev-<short sha> from `git rev-parse`: the alpine image ships no
    # git, so the musl leg stamped dev-nogit while the glibc leg stamped the
    # real sha, and repro:compare then failed on a difference that proves
    # nothing. What the proof is about is the toolchain and the base image,
    # not the version string, so both legs must stamp the same one.
    VERSION: repro-$CI_COMMIT_SHORT_SHA

repro:glibc:
  extends: .repro-build
  image: $GO_IMAGE
  variables:
    FLAVOR: glibc
  script:
    - make repro FLAVOR=glibc VERSION="$VERSION"
  artifacts:
    paths:
    - repro-glibc.sha256

repro:musl:
  extends: .repro-build
  image: golang:1.27.1-alpine
  variables:
    FLAVOR: musl
  script:
    # The alpine image ships no make. Installing it does not affect the
    # proof: pure Go, no cgo, -trimpath.
    - apk add --no-cache make
    - make repro FLAVOR=musl VERSION="$VERSION"
  artifacts:
    paths:
    - repro-musl.sha256

repro:compare:
  stage: verify
  image: $GO_IMAGE
  needs:
  - job: repro:glibc
    artifacts: true
  - job: repro:musl
    artifacts: true
  script:
    - cmp repro-glibc.sha256 repro-musl.sha256
    - 'echo "reproducible: $(cat repro-glibc.sha256) (glibc == musl)"'

# Decides from Conventional Commits whether a new version is due. No release
# commit is created (assets: []), so nothing extra lands on main; the
# semantic-release core itself creates the vX.Y.Z tag (tagFormat default) and
# pushes it to origin. That one tag is the single input both hosts'
# goreleaser jobs publish from.
release:
  stage: release
  image: node:22-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - test
  variables:
    GIT_AUTHOR_NAME: "procreepy release"
    GIT_AUTHOR_EMAIL: "13149478-po1nt-1@users.noreply.gitlab.com"
    GIT_COMMITTER_NAME: "procreepy release"
    GIT_COMMITTER_EMAIL: "13149478-po1nt-1@users.noreply.gitlab.com"
  script:
    - npm install --no-save --no-audit --no-fund semantic-release@25.0.9 @semantic-release/git@11.0.1 conventional-changelog-conventionalcommits@8.0.0
    # Push the tag with the protected PAT instead of the job token:
    # CI_JOB_TOKEN cannot create new refs by default, and a job-token push
    # would not trigger the tag pipeline goreleaser depends on anyway.
    # GITLAB_TOKEN is a Protected variable, so this job needs main to be a
    # protected branch.
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@$(git remote get-url origin | sed -E 's#^https://[^@]*@##; s#^https://##')"
    - npx --no-install semantic-release

# Publishes the tag as a GitLab Release. GoReleaser resolves the target
# platform from the origin remote (here: GitLab) and authenticates with the
# GITLAB_TOKEN project variable, so the same tag yields exactly one release
# per host — a re-run of this pipeline errors on the existing release
# instead of duplicating it.
goreleaser:
  stage: release
  image: $GO_IMAGE
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/'
  # Gate the publish on everything the release promises: the binaries and
  # their checksum manifest (dist, which pulls the whole build matrix) and
  # the glibc==musl reproducibility proof. artifacts: false on every entry
  # is load-bearing — inheriting any job's artifacts would drop untracked
  # files into the checkout and fail goreleaser's dirty-state check.
  needs:
    - job: test
      artifacts: false
    - job: dist
      artifacts: false
    - job: repro:compare
      artifacts: false
  script:
    - curl -LsSfL https://github.com/goreleaser/goreleaser/releases/download/v2.18.2/goreleaser_Linux_x86_64.tar.gz -o /tmp/goreleaser.tar.gz
    - tar -C /usr/local/bin -xzf /tmp/goreleaser.tar.gz goreleaser
    # Authenticate to the project container registry so the kos backend can
    # push the multi-arch image. CI_REGISTRY_USER/CI_REGISTRY_PASSWORD are the
    # predefined job-token registry credentials; ko reads ~/.docker/config.json.
    - mkdir -p ~/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > ~/.docker/config.json
    - goreleaser release --clean
  artifacts:
    paths:
    - dist/
    expire_in: 30 days
