# Single source of truth for the release tag pattern. The tag trigger is a
# glob ("v*") because on.push.tags cannot express the digit quantifiers, so
# tag runs re-check the exact pattern at runtime and fail fast on anything
# that is not a (pre)release version.
name: verify tag format
description: Fail the job when the tag is not vX.Y.Z[-prerelease]
runs:
  using: composite
  steps:
    - name: verify tag format
      if: github.ref_type == 'tag'
      shell: bash
      run: |
        re='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$'
        if [[ ! "${GITHUB_REF_NAME}" =~ $re ]]; then
          echo "'${GITHUB_REF_NAME}' does not match the release tag pattern"
          exit 1
        fi
