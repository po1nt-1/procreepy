name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # CodeQL uploads its results as code scanning alerts.
  security-events: write

# Container jobs default to `sh` (dash); the scripts use bash expansions
# like ${GITHUB_SHA::7}.
defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: "local"
  GOPROXY: "off"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "0"

# The tag trigger is a glob ("v*") because on.push.tags cannot express the
# semver digit pattern, so the entry jobs re-check the exact pattern via the
# composite action (placed after checkout, which the local action requires)
# and a malformed tag fails fast; jobs with needs: skip with their parents.
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27.1
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/tag-guard
    # Definition of done in one step: gofmt, compile, vet, full suite.
    # The suite's e2e run self-aggregates cover.e2e.out; e2e must never
    # run under -coverprofile (the two writers would collide).
    - name: definition of done
      run: make check
    # make coverage: e2e uninstrumented, non-e2e packages profiled, the
    # two profiles merged into the Cobertura report + merged text profile.
    - name: coverage
      run: make coverage
    - uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          coverage.xml
          merged.out
        if-no-files-found: error

  sast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/tag-guard
    - uses: actions/setup-go@v5
      with:
        go-version: "1.27.1"
    - uses: github/codeql-action/init@v3
      with:
        languages: go
    - uses: github/codeql-action/autobuild@v3
    - uses: github/codeql-action/analyze@v3
      with:
        category: "/language:go"

  build:
    # Zero deps + CGO_ENABLED=0: the whole matrix cross-compiles on one runner.
    runs-on: ubuntu-latest
    container: golang:1.27.1
    strategy:
      fail-fast: false
      matrix:
        include:
        - { goos: linux, goarch: amd64 }
        - { goos: linux, goarch: arm64 }
        - { goos: linux, goarch: arm }
        - { goos: windows, goarch: amd64 }
        - { goos: windows, goarch: arm64 }
        - { goos: darwin, goarch: amd64 }
        - { goos: darwin, goarch: arm64 }
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/tag-guard
    - name: release binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="dev-${GITHUB_SHA::7}"; fi
        make release GOOS="$GOOS" GOARCH="$GOARCH" VERSION="$VERSION"
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/

  dist:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        # Flatten: a bare pattern nests each artifact into a sub-directory,
        # which would prefix every SHA256SUMS entry (GitLab's are flat).
        merge-multiple: true
    - name: checksum manifest
      run: |
        cd dist
        find . -name '*.tar.gz' -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
        cat SHA256SUMS
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  repro:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { flavor: glibc, image: golang:1.27.1 }
        - { flavor: musl, image: golang:1.27.1-alpine }
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/tag-guard
    - name: build twice across a cold cache
      run: |
        # The alpine image ships no make. Installing it does not affect
        # the proof (pure Go, no cgo, -trimpath).
        if [ "${{ matrix.flavor }}" = "musl" ]; then apk add --no-cache make; fi
        make repro FLAVOR="${{ matrix.flavor }}"
    - uses: actions/upload-artifact@v4
      with:
        name: repro-${{ matrix.flavor }}.sha256
        path: repro-${{ matrix.flavor }}.sha256

  repro-compare:
    needs: repro
    runs-on: ubuntu-latest
    steps:
    # Single-name downloads land at the workspace root; a pattern with a
    # path nests each artifact into its own sub-directory.
    - uses: actions/download-artifact@v4
      with:
        name: repro-glibc.sha256
    - uses: actions/download-artifact@v4
      with:
        name: repro-musl.sha256
    - name: glibc == musl
      run: |
        cmp repro-glibc.sha256 repro-musl.sha256
        echo "reproducible: $(cat repro-glibc.sha256) (glibc == musl)"
