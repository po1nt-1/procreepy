version: 2
project_name: procreepy

builds:
  - id: procreepy
    main: ./cmd/procreepy
    binary: procreepy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X procreepy/internal/cli.versionStr={{.Version}}

archives:
  - id: procreepy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "CHECKSUMS.txt"

changelog:
  sort: asc
  abbrev: 7
  groups:
    - title: "Features"
      regexp: '^feat(\([[:word:]]*\))?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\([[:word:]]*\))?:.+$'
      order: 1
    - title: "Breaking Changes"
      regexp: '^[a-z]+(\([[:word:]]*\))?!:.+$'
      order: 2
    - title: "Performance"
      regexp: '^perf(\([[:word:]]*\))?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^docs?(\([[:word:]]*\))?:.+$'
      order: 4
    - title: "Other"
      order: 999
